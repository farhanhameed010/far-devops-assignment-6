version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - "8080:8080"
    container_name: jenkins
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    command: |
      sh -c '
        apt-get update && \
        apt-get install -y docker.io curl && \
        curl -fsSL https://deb.nodesource.com/setup_18.x | bash - && \
        apt-get install -y nodejs && \
        usermod -aG docker jenkins && \
        service docker start && \
        chmod 666 /var/run/docker.sock && \
        /usr/local/bin/jenkins.sh
      '
    networks:
      - tkxel

  jenkins-agent:
    build:
      context: .
      dockerfile: Dockerfile-agent
    container_name: jenkins-agent
    privileged: true
    user: root
    volumes:
      - jenkins_agent_data:/home/jenkins
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_AGENT_NAME=jenkins-agent
      - JENKINS_SECRET=${JENKINS_SECRET}

    networks:
      - tkxel
    depends_on:
      - jenkins

  sonarqube:
    container_name: sonarqube
    image: sonarqube:9.9-community
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
      - /home/ubuntu/sonar-config:/opt/sonarqube/conf
    ports:
      - "9000:9000"
    networks:
      - tkxel
    restart: always

  db:
    container_name: postgress-db
    image: postgres:12
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_data_storage:/var/lib/postgresql/data
    networks:
      - tkxel
    restart: always

networks:
  tkxel:
    name: tkxel-network
    driver: bridge

volumes:
  jenkins_data:
    name: tkxel_jenkins_data
  jenkins_agent_data:
    name: tkxel_jenkins_agent_data
  sonar_data:
    name: tkxel_sonar_data
  sonar_extensions:
    name: tkxel_sonar_extensions
  sonar_logs:
    name: tkxel_sonar_logs
  postgres_data:
    name: tkxel_postgres_data
  postgres_data_storage:
    name: tkxel_postgres_data_storage
